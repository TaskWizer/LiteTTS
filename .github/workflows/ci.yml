name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-cov pytest-asyncio ruff mypy bandit

      - name: Run ruff lint
        run: ruff check . --fix --exit-non-zero-on-findings || true

      - name: Check ruff formatting
        run: ruff format --check .

      - name: Run type checking
        run: mypy --ignore-missing-imports LiteTTS/ || true

      - name: Run security checks
        run: bandit -r LiteTTS/ -f json -o bandit-report.json || true

      - name: Run unit tests with coverage
        run: |
          pytest LiteTTS/tests/unit/ \
            --cov=LiteTTS \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -x -v --tb=short 2>&1 | head -100

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run integration tests
        run: |
          pytest LiteTTS/tests/test_api.py \
               LiteTTS/tests/test_api_endpoints.py \
               -v --tb=short 2>&1 | head -50 || true
